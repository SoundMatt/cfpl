name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python -m unittest discover -s tests -v
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile demo up -d --build --wait mock
      - run: docker compose --profile demo up -d ddns-demo
      - run: python3 scripts/e2e_demo.py
      - if: failure()
        run: docker compose --profile demo logs
